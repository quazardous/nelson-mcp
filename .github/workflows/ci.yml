#
# Unit tests, then the headless smoke: the built .oxt installed into a real
# LibreOffice and driven over MCP (scripts/smoke_test.py). The GUI runs
# (make smoke-wbox, smoke-wbox-kde) need a nested compositor and stay manual.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A TDF build pinned from the archive, which keeps every release; the
  # "stable" directory drops a version as soon as the next one ships.
  LO_VERSION: 26.8.0.3

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev pytest

  smoke:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache LibreOffice ${{ env.LO_VERSION }}
        id: lo-cache
        uses: actions/cache@v4
        with:
          path: ~/lo
          key: lo-${{ env.LO_VERSION }}-deb-x86_64

      - name: Download LibreOffice ${{ env.LO_VERSION }}
        if: steps.lo-cache.outputs.cache-hit != 'true'
        run: |
          base=https://downloadarchive.documentfoundation.org/libreoffice/old/$LO_VERSION/deb/x86_64
          tarball=LibreOffice_${LO_VERSION}_Linux_x86-64_deb.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          # Unpacked, not installed: nothing outside ~/lo, and no desktop
          # integration or update checker.
          mkdir -p ~/lo
          for deb in "$RUNNER_TEMP"/LibreOffice_*_deb/DEBS/*.deb; do
            case "$deb" in
              *kde-integration*|*gnome-integration*|*freedesktop-menus*|*onlineupdate*) continue ;;
            esac
            dpkg-deb -x "$deb" ~/lo
          done
          ls ~/lo/opt

      - name: Locate LibreOffice
        run: |
          program=$(dirname "$(ls -d ~/lo/opt/libreoffice*/program/soffice)")
          echo "LO_PROGRAM_DIR=$program" >> "$GITHUB_ENV"
          echo "SOFFICE=$program/soffice" >> "$GITHUB_ENV"
          "$program/soffice" --version

      - name: Runtime libraries for headless LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxinerama1 libxrandr2 libxrender1 \
            libsm6 libxt6 libcups2t64 libdbus-1-3 libnss3 libgl1

      - name: Build the extension
        run: |
          # The Windows sqlite payload: the smoke refuses an .oxt without it,
          # as the release does.
          python3 scripts/fetch_sqlite3.py --python-version 3.12
          # Checked in; the rule would otherwise try to regenerate it with an
          # SDK the runner does not have, whenever checkout leaves the .idl
          # newer.
          touch extension/XPromptFunction.rdb
          make build

      - name: Smoke test (headless)
        # LibreOffice's own Python: the harness talks to it over UNO too.
        run: $LO_PROGRAM_DIR/python scripts/smoke_test.py --keep

      - name: Keep the smoke profile and log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-profile
          path: /tmp/nelson-smoke-*
          if-no-files-found: ignore

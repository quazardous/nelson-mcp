name: http
title: Built-in HTTP server
requires: [config, events]
provides_services: [http_routes]
menu_group: network

actions:
  toggle_server:
    title: "Toggle HTTP Server"
    icon: running
  server_status:
    title: "Server Status"
    icon: stopped

menus:
  - title: "HTTP Server"
    context: [writer, calc, draw]
    submenu:
      - action: toggle_server
      - action: server_status

config:
  enabled:
    type: boolean
    default: true
    widget: checkbox
    label: Enable HTTP Server
    public: true

  port:
    type: int
    default: 8766
    min: 1024
    max: 65535
    widget: number
    label: Server Port
    public: true

  host:
    type: string
    default: localhost
    widget: text
    label: Bind Address
    public: true

  auth_token:
    type: string
    default: ""
    widget: password
    label: Access Token
    helper: "Required on every request once set (Authorization: Bearer <token>). Mandatory before binding to anything but localhost or starting a tunnel. Built-in launchers pass it automatically."
    public: true

  allowed_origins:
    type: string
    default: ""
    widget: text
    label: Allowed Browser Origins
    helper: "Comma-separated web origins allowed to call the server (e.g. https://example.com). Empty blocks every browser page. MCP clients are unaffected — they send no Origin header."
    public: true

  enable_config_api:
    type: boolean
    default: false
    widget: checkbox
    label: Enable Config API (/api/config)
    helper: "Lets an agent read and change Nelson's settings over HTTP. Access, network, tunnel, debug, launcher, folder and provider settings stay reserved to this dialog."
    public: true

  use_ssl:
    type: boolean
    default: false
    widget: checkbox
    label: Enable HTTPS
    public: true

  ssl_cert:
    type: string
    default: ""
    widget: file
    label: SSL Certificate
    helper: "Optional. Leave empty to use auto-generated self-signed certificate."
    file_filter: "PEM files (*.pem)|*.pem|All files (*.*)|*.*"

  ssl_key:
    type: string
    default: ""
    widget: file
    label: SSL Private Key
    helper: "Optional. Leave empty to use auto-generated self-signed key."
    file_filter: "PEM files (*.pem)|*.pem"

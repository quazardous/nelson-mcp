name: writer
title: Writer document tools
requires: [document, config, format]
config_inline: doc

config:
  max_content_chars:
    type: int
    default: 50000
    min: 1000
    max: 500000
    widget: number
    label: Max Content Size
    public: true
  search_backend:
    type: string
    default: direct
    widget: select
    label: Search backend for text_search
    public: true
    description: >
      How text_search searches the document body. 'direct' does an exact
      literal/regex scan (always fresh, regex-capable). 'index' uses the
      stemmed full-text index (fuzzy word matching, boolean operators, faster on
      large documents, but no regex). Text frames are always searched in both
      modes. Falls back to direct when the index module is unavailable.
    options:
      - value: direct
        label: Direct (exact / regex)
      - value: index
        label: Index (stemmed / fuzzy)

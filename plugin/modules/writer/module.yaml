name: writer
title: Writer document tools
requires: [document, config, format]
config_inline: doc

config:
  max_content_chars:
    type: int
    default: 50000
    min: 1000
    max: 500000
    widget: number
    label: Max Content Size
    public: true
  tracked_changes_view:
    type: string
    default: accepted
    widget: select
    label: Tracked changes in text_read
    public: true
    description: >
      How text_read shows text that has tracked changes not yet accepted or
      rejected. 'accepted' shows the text as it reads once they are accepted:
      inserted text in, deleted text out. 'original' shows it as it read
      before them. 'marked' shows both, inserted text in <ins>, deleted text
      in <del>. Change recording keeps deleted text in the document, so
      without this a replace read back as old and new text run together.
    options:
      - value: accepted
        label: As if accepted
      - value: original
        label: As before the changes
      - value: marked
        label: Marked with <ins> and <del>
  change_author:
    type: string
    default: ""
    widget: text
    label: Sign the agent's tracked changes as
    description: >
      Name shown on changes an MCP agent makes while change recording is on,
      e.g. "AI agent (Nelson)", so reviewers can tell its edits from yours.
      Empty: they carry your own name (Tools > Options > User Data), like
      anything else you record. While a call runs, Nelson puts this name in
      your LibreOffice user profile and puts yours back right after.
  change_author_restore:
    type: string
    default: ""
    internal: true
  search_backend:
    type: string
    default: direct
    widget: select
    label: Search backend for text_search
    public: true
    description: >
      How text_search searches the document body. 'direct' does an exact
      literal/regex scan (always fresh, regex-capable). 'index' uses the
      stemmed full-text index (fuzzy word matching, boolean operators, faster on
      large documents, but no regex). Text frames are always searched in both
      modes. Falls back to direct when the index module is unavailable.
    options:
      - value: direct
        label: Direct (exact / regex)
      - value: index
        label: Index (stemmed / fuzzy)

name: core
title: Core services (config, events, logging)
provides_services: [document, config, events, format]
requires: []
config_inline: main

config:
  log_level:
    type: string
    default: WARN
    widget: select
    label: Log Level
    public: true
    options:
      - value: DEBUG
        label: Debug
      - value: INFO
        label: Info
      - value: WARN
        label: Warning
      - value: ERROR
        label: Error
  force_track_changes:
    type: boolean
    default: true
    widget: checkbox
    label: Prevent MCP from disabling change recording
    description: >
      When change recording is on, refuse any MCP call that tries to turn
      it off. This keeps an AI agent from quietly disabling its own audit
      trail. It never overrides a choice you made yourself: if recording
      is off, Nelson leaves it off.
  auto_enable_track_changes:
    type: boolean
    default: false
    widget: checkbox
    label: Turn change recording on for MCP edits (not recommended)
    description: >
      Switch change recording on before the first MCP edit, even on a
      document that does not have it. Off by default because the flag is
      document-wide and sticky: everything typed afterwards is recorded
      too, including your own edits, and superseded values are kept
      inside the saved file.
  sqlite3_status:
    widget: check
    label: SQLite3 Status
    check_provider: "plugin.modules.core:check_sqlite3"
  follow_activity:
    type: boolean
    default: true
    widget: checkbox
    label: Follow MCP activity (scroll to mutations)
    description: >
      Automatically scroll the document view to the location of MCP
      mutation operations (page granularity). This helps track what
      the AI is modifying in real time.
